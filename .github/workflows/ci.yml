name: CI

on:
  push:
  pull_request:

jobs:
  dotnet-build-test:
    name: .NET build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore FreightRateAI.sln

      - name: Build solution
        run: dotnet build FreightRateAI.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test FreightRateAI.sln --configuration Release --no-build --verbosity normal

  docker-compose-validation:
    name: Docker Compose validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create CI environment file
        run: cp .env.example .env

      - name: Validate Docker Compose config
        run: docker compose config

      - name: Build Docker Compose services
        run: docker compose build

  python-ai-service-check:
    name: Python AI service check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/ai-recommendation-service/requirements.txt

      - name: Install dependencies
        working-directory: services/ai-recommendation-service
        run: python -m pip install -r requirements.txt

      - name: Import FastAPI app
        working-directory: services/ai-recommendation-service
        env:
          AI_PROVIDER: none
        run: python -c "from app.main import app; print(app.title)"
