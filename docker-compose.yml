services:
  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${AUTH_DB_NAME:-freightrate_auth};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      Jwt__Secret: ${JWT_SECRET:?JWT_SECRET is required. Copy .env.example to .env and set JWT_SECRET.}
      Jwt__Issuer: ${JWT_ISSUER:-FreightRateAI.Auth}
      Jwt__Audience: ${JWT_AUDIENCE:-FreightRateAI.Services}
      Jwt__ExpiryMinutes: ${JWT_EXPIRY_MINUTES:-60}
    depends_on:
      - postgres
      - redis

  quote-service:
    build:
      context: .
      dockerfile: services/quote-service/Dockerfile
    ports:
      - "5002:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${QUOTE_DB_NAME:-freightrate_quote};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      Jwt__Secret: ${JWT_SECRET:?JWT_SECRET is required. Copy .env.example to .env and set JWT_SECRET.}
      Jwt__Issuer: ${JWT_ISSUER:-FreightRateAI.Auth}
      Jwt__Audience: ${JWT_AUDIENCE:-FreightRateAI.Services}
      Jwt__ExpiryMinutes: ${JWT_EXPIRY_MINUTES:-60}
      Redis__ConnectionString: ${REDIS_CONNECTION_STRING:-redis:6379}
      AiService__BaseUrl: ${AI_SERVICE_BASE_URL:-http://ai-recommendation-service:8000}
      AiService__TimeoutSeconds: ${AI_SERVICE_TIMEOUT_SECONDS:-3}
    depends_on:
      - postgres
      - redis

  ai-recommendation-service:
    build:
      context: .
      dockerfile: services/ai-recommendation-service/Dockerfile
    ports:
      - "8000:8000"
    environment:
      AI_PROVIDER: ${AI_PROVIDER:-none}
      AI_MODEL: ${AI_MODEL:-}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-5}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-freightrate}
      AUTH_DB_NAME: ${AUTH_DB_NAME:-freightrate_auth}
      QUOTE_DB_NAME: ${QUOTE_DB_NAME:-freightrate_quote}
    volumes:
      - ./services/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./reverse-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - quote-service
      - ai-recommendation-service

volumes:
  postgres-data:
