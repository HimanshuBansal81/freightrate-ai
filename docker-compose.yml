services:
  auth-service:
    build:
      context: ./services/auth-service
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: ${AUTH_DB_CONNECTION:-Host=postgres;Port=5432;Database=freightrate_auth;Username=postgres;Password=postgres}
      Jwt__Secret: ${JWT_SECRET:-replace-with-a-long-development-secret-key-at-least-32-characters}
      Jwt__Issuer: ${JWT_ISSUER:-FreightRateAI.Auth}
      Jwt__Audience: ${JWT_AUDIENCE:-FreightRateAI.Services}
      Jwt__ExpiryMinutes: ${JWT_EXPIRY_MINUTES:-60}
    depends_on:
      - postgres
      - redis

  quote-service:
    build:
      context: ./services/quote-service
    ports:
      - "5002:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: ${QUOTE_DB_CONNECTION:-Host=postgres;Port=5432;Database=freightrate_quote;Username=postgres;Password=postgres}
      Jwt__Secret: ${JWT_SECRET:-replace-with-a-long-development-secret-key-at-least-32-characters}
      Jwt__Issuer: ${JWT_ISSUER:-FreightRateAI.Auth}
      Jwt__Audience: ${JWT_AUDIENCE:-FreightRateAI.Services}
      Redis__ConnectionString: ${REDIS_CONNECTION_STRING:-redis:6379}
      AiService__BaseUrl: ${AI_SERVICE_BASE_URL:-http://ai-recommendation-service:8000}
      AiService__TimeoutSeconds: ${AI_SERVICE_TIMEOUT_SECONDS:-3}
    depends_on:
      - postgres
      - redis

  ai-recommendation-service:
    build:
      context: ./services/ai-recommendation-service
    ports:
      - "8000:8000"
    environment:
      AI_PROVIDER: ${AI_PROVIDER:-none}
      AI_MODEL: ${AI_MODEL:-}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-5}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-freightrate_auth}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./reverse-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - quote-service
      - ai-recommendation-service

volumes:
  postgres-data:
