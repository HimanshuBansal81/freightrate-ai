services:
  auth-service:
    build:
      context: ./services/auth-service
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=freightrate_auth;Username=postgres;Password=postgres
      Jwt__Secret: replace-with-a-long-development-secret-key-at-least-32-characters
      Jwt__Issuer: FreightRateAI.Auth
      Jwt__Audience: FreightRateAI.Services
      Jwt__ExpiryMinutes: 60
    depends_on:
      - postgres
      - redis

  quote-service:
    build:
      context: ./services/quote-service
    ports:
      - "5002:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
    depends_on:
      - postgres
      - redis

  ai-recommendation-service:
    build:
      context: ./services/ai-recommendation-service
    ports:
      - "8000:8000"

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: freightrate_auth
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./reverse-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - quote-service
      - ai-recommendation-service

volumes:
  postgres-data:
